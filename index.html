<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Peso Ideal para Mochilas</title>
    <link rel="icon" href="logo.ico" type="image/x-icon">
    <meta property="og:title" content="Peso de Cargueira">
    <meta property="og:description" content="Peso Conforto Aproximado">
    <meta property="og:image" content="https://trilhandotrekking.github.io/peso/logoTrilhando.png">
    <meta property="og:url" content="https://trilhandotrekking.github.io/peso/">
	
	
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #007bff, #0056b3);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
      color: #1a1a1a;
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      padding-bottom: 15px;
    }

    h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: #007bff;
      border-radius: 2px;
    }

    .input-group {
      margin-bottom: 25px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #4a4a4a;
      font-weight: 500;
      font-size: 14px;
      padding-left: 5px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #007bff;
      background: #fff;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.1);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
    }

    .resultado {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      color: #1a1a1a;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      border: 2px dashed #007bff;
    }

    .resultado.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .icone {
      font-size: 24px;
      margin-right: 10px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px;
      }
      
      h1 {
        font-size: 24px;
      }
    }

	   .assinatura {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #666;
      letter-spacing: 0.5px;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .assinatura:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎒 Calculadora de Peso Ideal para Mochilas</h1>

    <div class="input-group">
      <label for="peso">Seu Peso (kg)</label>
      <input type="number" id="peso" placeholder="Ex: 70" min="0" step="0.1">
    </div>

    <div class="input-group">
      <label for="altura">Sua Altura (cm)</label>
      <input type="number" id="altura" placeholder="Ex: 170" min="0" step="1">
    </div>

    <div class="input-group">
      <label for="genero">Gênero</label>
      <select id="genero">
        <option value="homem">Homem</option>
        <option value="mulher">Mulher</option>
      </select>
    </div>

    <div class="input-group">
      <label for="tipo">Tipo de Atividade</label>
      <select id="tipo">
        <option value="leve">Travessia (1-3 dias)</option>
        <option value="moderada">Travessia (4-7 dias)</option>
        <option value="intensa">Travessia (+7 dias)</option>
      </select>
    </div>

    <button onclick="calcularPesoIdeal()">Calcular Peso Ideal</button>

    <div id="resultado" class="resultado"></div>
  </div>

	 <div class="container">
    <!-- ... (todo o conteúdo anterior permanece igual) ... -->
    
    <div class="assinatura">
      Desenvolvido por: Robson D. Oliveira
    </div>
  </div>

  <script>
    function calcularPesoIdeal() {
      const peso = parseFloat(document.getElementById('peso').value);
      const altura = parseFloat(document.getElementById('altura').value);
      const genero = document.getElementById('genero').value;
      const tipo = document.getElementById('tipo').value;
      const resultado = document.getElementById('resultado');

      if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
        resultado.textContent = "⚠️ Por favor, insira valores válidos!";
        resultado.classList.add('mostrar');
        return;
      }

      // Cálculos base
      let base = genero === 'homem' ? peso * 0.20 : peso * 0.15;
      
      // Ajuste por altura
      const ajusteAltura = Math.max(0, (altura - 160) / 5 * 0.01);
      base += base * ajusteAltura;

      // Fator de atividade
      const fatores = { leve: 1.0, moderada: 0.9, intensa: 0.8 };
      const pesoIdeal = base * fatores[tipo];

      resultado.innerHTML = `
        <div style="margin-bottom: 10px;">🎒 Peso Ideal Recomendado:</div>
        <div style="font-size: 24px; color: #007bff; font-weight: bold;">
          ${pesoIdeal.toFixed(1)} kg
        </div>
        <div style="margin-top: 15px; font-size: 14px; color: #666;">
          * Baseado em seu perfil e tipo de atividade
        </div>
      `;

      resultado.classList.add('mostrar');
    }
  </script>
</body>
</html>
